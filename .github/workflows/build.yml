name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build plugin
        run: ./gradlew check :plugin:buildPlugin :plugin:verifyPlugin

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v7
        with:
          name: prompt-templates-plugin
          path: plugin/build/distributions/*.zip
          if-no-files-found: error

  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Run IDE UI integration tests
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          ./gradlew :plugin:integrationTest --stacktrace

      - name: Upload IDE UI test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prompt-templates-ui-e2e
          path: |
            out/ide-tests/
            plugin/build/allure-results/
            plugin/build/ui-test/
            plugin/build/reports/tests/integrationTest/
            plugin/build/test-results/integrationTest/
          if-no-files-found: warn
