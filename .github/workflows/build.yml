name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build plugin
        run: ./gradlew check :plugin:buildPlugin :plugin:verifyPlugin

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v7
        with:
          name: prompt-templates-plugin
          path: plugin/build/distributions/*.zip
          if-no-files-found: error
