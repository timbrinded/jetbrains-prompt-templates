name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Reuse Gradle state across updates to trusted, same-repository PRs.
          # GitHub isolates PR caches, so fork PRs remain read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Test and build plugin
        run: ./gradlew check :plugin:buildPlugin :plugin:verifyPlugin

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v7
        with:
          name: prompt-templates-plugin
          path: plugin/build/distributions/*.zip
          if-no-files-found: error

  core-tests:
    # The core module has no IntelliJ dependency; these legs exercise Windows and case-insensitive filesystem paths.
    name: core-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Run core tests
        shell: bash
        run: ./gradlew :core:test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-reports-${{ matrix.os }}
          path: core/build/reports/tests/
