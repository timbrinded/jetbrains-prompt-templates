name: Verify latest IDEs

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Checks the newest release and EAP of each product so platform changes surface before Marketplace verification.
    name: verify (${{ matrix.ide }})
    strategy:
      fail-fast: false
      matrix:
        ide: [IntellijIdea, RustRover, WebStorm]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify plugin
        run: ./gradlew :plugin:verifyPlugin -PverifyLatest=${{ matrix.ide }}

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifier-reports-${{ matrix.ide }}
          path: plugin/build/reports/pluginVerifier/
          if-no-files-found: ignore
